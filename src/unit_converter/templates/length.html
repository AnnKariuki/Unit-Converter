{%extends "layouts.html" %} 
{% block content %}
<!--DO NOT USE GET since it appends info to your url as query/search params especially when submitting secure info like passwords-->
<form action="" method="POST">
  <div class="container">
    <!--for connects a label to an input element. This tells the browser that the label belongs to that input.One benefit is that clicking the label automatically focuses the 
                    corresponding input field. -->
    <label for="length">Enter the length to convert</label>
    <!--The name attribute identifies the input's value when the browser submits the form to the server.Suppose the user enters 100 and your input name is fname. When the form is 
                    submitted, the browser sends form data containing: fname=100. step any - abritrary decimal precision-->
    <input type="number" id="length" name="length" step="any" required />
  </div>

  <br />

  <div class="container">
    <label for="from_unit">Unit to Convert from</label>
    <select name="from_unit" id="from_unit">
      <option value="millimeter">Millimeter</option>
      <option value="centimeter">Centimeter</option>
      <option value="meter">Meter</option>
      <option value="kilometer">Kilometer</option>
      <option value="inch">Inch</option>
      <option value="foot">Foot</option>
      <option value="yard">Yard</option>
      <option value="mile">Mile</option>
    </select>
  </div>

  <br />

  <div class="container">
    <label for="to_unit">Unit to Convert to</label>
    <select name="to_unit" id="to_unit">
      <option value="millimeter">Millimeter</option>
      <option value="centimeter">Centimeter</option>
      <option value="meter">Meter</option>
      <option value="kilometer">Kilometer</option>
      <option value="inch">Inch</option>
      <option value="foot">Foot</option>
      <option value="yard">Yard</option>
      <option value="mile">Mile</option>
    </select>
  </div>

  <br />

  <div>
    <button type="submit">Convert</button>
  </div>
</form>
{% endblock content %}
