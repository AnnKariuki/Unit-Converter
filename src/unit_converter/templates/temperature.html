{%extends "layouts.html" %} 
{% block content %}
<form action="" method="POST">
  <div class="container">
  <label for="temperature">Enter the temperature to convert</label>
    <input type="number" id="temperature" name="temperature" step="any" required />
  </div>

  <br />

  <div class="container">
    <label for="from_unit">Unit to Convert from</label>
    <select name="from_unit" id="from_unit">
      <option value="kelvin">Kelvin</option>
      <option value="fahrenheit">Fahrenheit</option>
      <option value="celsius">Celsius</option>
    </select>
  </div>

  <br />

  <div class="container">
    <label for="to_unit">Unit to Convert to</label>
    <select name="to_unit" id="to_unit">
      <option value="kelvin">Kelvin</option>
      <option value="fahrenheit">Fahrenheit</option>
      <option value="celsius">Celsius</option>
    </select>
  </div>

  <br />

  <div>
    <button type="submit">Convert</button>
  </div>
</form>
{% endblock content %}
