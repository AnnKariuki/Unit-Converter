[project]
name = "unit-converter"
version = "0.1.0"
description = "a simple web app that can convert between different units of measurement."
readme = "README.md"
authors = [
    { name = "Ann Kariuki", email = "ann.kariuki@duke.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.142.4",
    "httpx>=0.28.1",
    "httpx2>=2.15.1",
]

[project.scripts]
unit-converter = "unit_converter:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
